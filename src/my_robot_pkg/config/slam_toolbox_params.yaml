slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Frame names — must match your TF tree.
    # For Task 5.5 (noisy odom), change these to: odom_noisy / base_footprint_noisy
    odom_frame: odom
    base_frame: base_footprint
    map_frame: map
    scan_topic: /scan

    # Online mapping mode (vs. localization against a saved map)
    mode: mapping

    # How far the robot must move before inserting a new pose-graph node.
    # Too small → dense graph, slow. Too large → coarse map.
    minimum_travel_distance: 0.1     # metres
    minimum_travel_heading: 0.0873   # radians (~5 degrees)
    minimum_time_interval: 0.5       # seconds (rate-limits node insertion)

    # Map grid resolution: each cell = 5 cm × 5 cm
    resolution: 0.05

    # Must match fake_scan_publisher range limits — scans outside this are ignored
    minimum_laser_range: 0.12
    maximum_laser_range: 3.5

    # Scan matching — on by default, just making it explicit
    use_scan_matching: true
    use_scan_barycenter: true

    # Loop closure — search within 3 m of current pose for revisited locations
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
